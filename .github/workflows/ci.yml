name: Swift package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # Independent real databases can contend for short lifecycle admission deadlines
        # on shared runners. Concurrency scenarios inside each test still execute.
        run: swift test --no-parallel
      - name: Release build
        run: swift build -c release
